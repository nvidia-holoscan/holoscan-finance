#
# Three test tiers (pytest markers in pyproject.toml):
#   unit-pure  any Python 3.12+, no SDK: library, control and deploy tests
#   unit-sdk   the Holoscan 5.0 image on a CPU runner, with a stub libcuda: operator harness
#              tests on CPU backends, every application plan, CPU graphs
#   gpu        a self-hosted GPU runner: GPU and slow tests, CTest, smoke runs, the wheel
# Holoscan SDK 5.0 is not published on PyPI, so the SDK tiers run in the 5.0 image.
# Inside a container holoscan-cli always runs with --local: its container mode needs a docker
# daemon. `timing` tests never run in CI (shared runners make them flaky).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned by digest (the multi-architecture index of the v5.0.0-cuda13 tag): a re-tagged image
  # cannot change what the pull_request jobs execute. The tag stays for readability; docker
  # resolves the digest. To move to a new image, look up its index digest and replace both.
  HOLOSCAN_IMAGE: nvcr.io/nvidia/clara-holoscan/holoscan:v5.0.0-cuda13@sha256:faa23a3a2479697fd64babcb27d28cf97f21d5da54d65c92225f8a9b0d99264a

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-cli.txt -c requirements-dev.txt pre-commit
      - run: pre-commit run --show-diff-on-failure --all-files

  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-cli.txt
      - run: holoscan list --json
      - run: holoscan modes equity_analytics
      - run: holoscan modes market_data_bench

  unit-pure:
    name: unit-pure (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: >-
          python -m pip install -r requirements-cli.txt -c requirements-dev.txt numpy scipy threadpoolctl fastapi uvicorn
          anyio httpx pytest pytest-timeout
      - run: python -m pytest -m "not sdk and not gpu and not daqiri"
        env:
          PYTHONPATH: python

  unit-sdk:
    # No `container:` here: a job container is pulled before any step could free disk, and the
    # 15.6 GB image does not fit the ~14 GB a standard runner has free. If the pull still runs
    # out of space, move this job to the self-hosted runner (runs-on: [self-hosted, linux]).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk for the Holoscan image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - name: SDK tests on the CPU (stub libcuda)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:$PWD" -w "$PWD" \
            --entrypoint bash "$HOLOSCAN_IMAGE" -c '
              set -e
              python3 -m pip install --user -q -r requirements-dev.txt
              PYTHONPATH=$PYTHONPATH:$PWD/python:$PWD/tests/python scripts/with_stub_libcuda.sh \
                python3 -m pytest -q -m "sdk and not gpu and not slow"'

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-dev.txt build setuptools
      - run: python -m build --wheel -o dist
      - name: Install into a fresh venv and import from outside the checkout
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /
          /tmp/v/bin/python -c "
          import importlib.metadata as m, importlib.resources as r
          import holoscan_finance as g, holoscan_finance.marketdata.sbe_codec
          assert g.__file__.startswith('/tmp/v/'), g.__file__
          assert 'finance' in [e.name for e in m.entry_points(group='holoscan.modules')]
          assert r.files(g).joinpath('dashboard/webui/index.html').is_file()
          assert r.files(g).joinpath('ingest/native/daqiri_drain.cpp').is_file()
          "
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: holoscan-finance-wheel
          path: dist/*.whl

  gpu:
    # Requires a self-hosted GPU runner; define the repository variable ENABLE_GPU_CI=true after
    # provisioning one. Push only (after merge), never pull_request: untrusted PR code must not
    # execute on persistent self-hosted GPU runners.
    if: ${{ github.event_name == 'push' && vars.ENABLE_GPU_CI == 'true' }}
    runs-on: [self-hosted, linux, gpu]
    env:
      IMAGE: holoscan-finance-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the dev image (5.0 base, holoscan-cli, test dependencies)
        run: docker build -t "$IMAGE" .
      - name: GPU and slow tests, CTest, smoke runs, wheel
        # Non-root with a private IPC namespace: never --ipc=host (a root Holoscan 5 process
        # with host IPC leaves a root-owned shared-memory file that breaks later runs).
        # `holoscan test` runs every CTest tier (tests/CMakeLists.txt: python.unit and python.gpu,
        # i.e. all tests not marked slow), so pytest adds only the slow ones.
        run: |
          docker run --rm --runtime=nvidia -e NVIDIA_VISIBLE_DEVICES=all -u "$(id -u):$(id -g)" \
            -e HOME=/tmp --shm-size=2g --ulimit stack=33554432 -v "$PWD:$PWD" -w "$PWD" \
            --entrypoint bash "$IMAGE" -c '
              set -e
              export PYTHONPATH=$PYTHONPATH:$PWD/python:$PWD/tests/python
              holoscan test --local --no-xvfb
              python3 -m pytest -q -m "slow and not timing"
              holoscan run equity_analytics smoke --local
              holoscan run market_data_bench smoke --local
              holoscan package --pkg-generator WHEEL --local'
      - name: Remove the dev image
        if: always()
        run: docker image rm -f "$IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: holoscan-finance-wheel-gpu
          path: build/dist/*.whl
