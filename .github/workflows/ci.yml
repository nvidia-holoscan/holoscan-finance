name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.17
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    name: CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install cmake ninja pytest pytest-timeout numpy scipy duckdb pyarrow threadpoolctl fastapi uvicorn
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFINANCE_BUILD_TESTING=ON -DBUILD_ALL=ON
          cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build --wheel
      - name: Install the wheel and import the SDK-free codec
        run: |
          pip install --no-deps dist/*-py3-none-any.whl
          cd / && python -c "from holoscan.marketdata import mitch; print(mitch.inspect_unit)"
      - uses: actions/upload-artifact@v4
        with:
          name: holoscan-finance-wheel
          path: dist/*.whl
