[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "holoscan-finance"
version = "0.2.0"
description = "Holoscan Module for Financial Services Industry: reusable Holoscan SDK 5 operators for streaming market data (MITCH ingest over UDP, DAQIRI, GPUDirect or NIC-free replay; quote bars; rolling GPU risk) and example applications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "NVIDIA Corporation" }]
# The Holoscan SDK is NEVER a pip dependency: Holoscan SDK 5.0 is not published on PyPI; use the 5.0 image or Debian packages.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
gpu = ["cupy-cuda13x>=14"]
analytics = ["scipy>=1.11", "threadpoolctl>=3.5"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "anyio>=4"]
bench = ["numba>=0.68"]
test = ["pytest>=8", "pytest-timeout>=2", "httpx>=0.27"]

[project.entry-points."holoscan.modules"]
finance = "holoscan_finance"

[tool.setuptools.packages.find]
where = ["python"]
include = ["holoscan_finance*"]

[tool.setuptools.package-data]
holoscan_finance = ["py.typed", "dashboard/webui/*.html", "ingest/native/*.cpp"]

[tool.holoscan]
cuda = 13
workspace-name = "holoscan-finance"
forward-env = ["CUDA_VISIBLE_DEVICES", "CUDA_DEVICE_ORDER", "HOLOSCAN_FINANCE_NATIVE_DRAIN", "HOLOSCAN_FINANCE_FAULTS"]
search-paths = ["operators", "examples"]
docker-run-args = ["--tmpfs=/dev/shm:rw,exec,size=4g"]      # never share the host /dev/shm (SECURITY.md, shared-memory topics); no --as-root needed

[tool.holoscan.base-images]
x86_64 = "nvcr.io/nvidia/clara-holoscan/holoscan:v5.0.0-cuda13"
aarch64 = "nvcr.io/nvidia/clara-holoscan/holoscan:v5.0.0-cuda13"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python", "tests/python"]
addopts = "-p no:cacheprovider -ra --strict-markers"
timeout = 300
filterwarnings = [
    # Starlette >= 1.9 asks TestClient users for httpx2; httpx 0.28 still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
markers = [
    "sdk: needs the Holoscan 5 SDK (import holoscan)",
    "gpu: needs CuPy and a CUDA device",
    "daqiri: needs the daqiri module",
    "slow: takes more than 30 s",
    "timing: asserts a latency/pacing/throughput bound; run only in the serial timing pass",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build*", "dist", ".cache", ".local", ".cupy", "data", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["holoscan_finance"]
known-third-party = ["holoscan"]
