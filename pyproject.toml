[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "holoscan-finance"
version = "0.1.0"
description = "Streaming NYQ equity analytics on Holoscan, with GPUDirect MITCH ingest."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "NVIDIA Corporation" },
]
requires-python = ">=3.10"

# NOTE: holoscan SDK is not declared as a runtime dependency here because the
# wheel cannot guarantee binary compatibility across CUDA variants (cu12/cu13).
# Document the install command in the README.

[project.optional-dependencies]
equities = [
    "numpy>=1.26", "scipy>=1.11", "duckdb>=1.5", "pyarrow>=16",
    "threadpoolctl>=3.5", "fastapi>=0.115", "uvicorn>=0.30",
]

[tool.scikit-build]
cmake.version = ">=3.24"
# Build only what the wheel needs: turn off test and app subprojects, and
# turn off the deb option (which is build-type-driven, not wheel-driven).
cmake.args = [
    "-DFINANCE_BUILD_TESTING=OFF",
    "-DBUILD_ALL=OFF",
    "-DOP_gpu_mitch_source_op=ON",
    "-DOP_gpu_quote_bars_op=ON",
    "-DOP_gpu_rolling_risk_op=ON",
]
# Wheel content comes from CMake install rules. Use *relative* DESTINATIONs in
# install(...) calls — scikit-build-core stages those into the wheel root.
# Setting wheel.install-dir = "/" would require the experimental flag.
wheel.packages = []
# This module contains no extension modules, so publish one ABI- and
# platform-independent wheel (the separately installed Holoscan SDK remains
# responsible for selecting a platform/CUDA-compatible distribution).
wheel.py-api = "py3"
wheel.platlib = false

[tool.ruff]
line-length = 100
target-version = "py310"
# The post-gen hook copies cmake/pybind11/ into this tree from the HoloHub
# clone; build*/, dist/ are CMake/wheel outputs; .local/, .cache/, .cupy/
# are dev-container HOME junk.
exclude = [
    "build*",
    "dist",
    ".cache",
    ".local",
    ".cupy",
    "cmake/pybind11",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["holoscan"]
